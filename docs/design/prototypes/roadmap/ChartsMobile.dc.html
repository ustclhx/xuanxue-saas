<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>紫微盘手机版</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.east{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F2EC;--ink:#1F1C18;--muted:#4A443B;--subtle:#6B6355;--line:#DCD3C1;--line-strong:#C9BEA8;--accent:#B8432F;--accent-ink:#9E3A27}
.east.dark{--bg:#1A1815;--surface:#24211C;--surface-2:#2C2823;--ink:#ECE5D6;--muted:#CFC6B4;--subtle:#A89F8E;--line:#3A352D;--line-strong:#4E473C;--accent:#D0583F;--accent-ink:#E58A72}
</style>
</helmet>
<div class="{{cls}}" style="width: 390px; min-height: 1700px; box-sizing: border-box; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: -apple-system, 'PingFang TC', sans-serif; display: flex; flex-direction: column; gap: 20px;">
  <h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 22px;">紫微十二宮</h2>
  <p style="margin: 0; font-size: 13px; color: var(--subtle); line-height: 1.6;">手機上整盤等比縮小（最小字 11px），只顯示主星；完整星曜看下方宮位列表。</p>
  <figure role="img" aria-label="紫微斗數十二宮命盤縮圖，命宮在[巳]" style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, 76px); border: 1px solid var(--line-strong); background: var(--surface);">
    <sc-for list="{{palaces}}" as="p" hint-placeholder-count="12">
      <div style="grid-column: {{p.col}}; grid-row: {{p.row}}; border: {{p.border}}; padding: 5px; display: flex; flex-direction: column; justify-content: space-between;">
        <strong style="font-family: 'Noto Serif TC', serif; font-size: 13px; color: var(--accent-ink);">[主星]</strong>
        <span style="font-size: 11px; display: flex; justify-content: space-between;"><span>{{p.short}}</span><span style="color: var(--subtle);">{{p.branch}}</span></span>
      </div>
    </sc-for>
    <div style="grid-column: 2 / span 2; grid-row: 2 / span 2; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: var(--muted); gap: 2px;"><strong style="font-family: 'Noto Serif TC', serif; font-size: 14px; color: var(--ink);">[庚午年] 男</strong>[水二局]</div>
  </figure>
  <section aria-labelledby="list">
    <h3 id="list" style="margin: 0 0 10px; font-size: 16px;">宮位列表</h3>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{palaces}}" as="p" hint-placeholder-count="12">
        <li style="padding: 12px 14px; border-radius: 10px; background: var(--surface); border: {{p.border}}; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: baseline;">
          <span style="font-weight: 600;">{{p.name}}<span style="color: var(--subtle); font-weight: 400;"> {{p.branch}}</span></span>
          <span style="font-size: 14px; color: var(--muted);"><strong style="color: var(--accent-ink); font-family: 'Noto Serif TC', serif;">[主星]</strong> · [輔星、四化]</span>
        </li>
      </sc-for>
    </ul>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const names = ['命宮','兄弟','夫妻','子女','財帛','疾厄','遷移','交友','官祿','田宅','福德','父母'];
    const branches = ['巳','午','未','申','酉','戌','亥','子','丑','寅','卯','辰'];
    const pos = [[1,1],[1,2],[1,3],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[3,1],[2,1]];
    const palaces = names.map((n, i) => ({ name: n, short: n.slice(0, 2), branch: branches[i], row: String(pos[i][0]), col: String(pos[i][1]),
      border: i === 0 ? '2px solid var(--accent)' : '1px solid var(--line)' }));
    return { cls: dark ? 'east dark' : 'east', palaces };
  }
}
</script>
</body>
</html>
